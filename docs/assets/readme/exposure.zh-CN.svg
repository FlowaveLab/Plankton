    <text x="801" y="485" font-size="19" fill="#706d67" font-weight="400">证据未知时不能自动放行。</text>
    <text x="48" y="580" font-size="22" fill="#171716" font-weight="550">范围内 + 有效的允许决定 → 交付；否则 → 拒绝或转人工。</text>
    <text x="48" y="617" font-size="19" fill="#706d67" font-weight="400">图中展示可配置范围；Protected 默认禁止网络暴露。</text>
