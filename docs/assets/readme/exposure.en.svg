    <rect x="779" y="185" width="373" height="348" fill="#fffefb" stroke="#f2381e" />
    <text x="801" y="221" font-size="17" fill="#f2381e" font-weight="700">THE REVIEWER COMPARES</text>
    <text x="801" y="264" font-size="22" fill="#171716" font-weight="400">Saved exposure profile</text>
    <text x="801" y="293" font-size="22" fill="#171716" font-weight="400">+ runtime call-chain evidence</text>
    <text x="801" y="322" font-size="22" fill="#171716" font-weight="400">+ intended credential use</text>
    <path d="M961 344 L961 379" stroke="#706d67" stroke-width="2" fill="none" marker-end="url(#arrow)" />
    <text x="801" y="417" font-size="24" fill="#171716" font-weight="650">Plankton validates locally</text>
    <text x="801" y="456" font-size="19" fill="#706d67" font-weight="400">Check scope and destinations.</text>
    <text x="801" y="485" font-size="19" fill="#706d67" font-weight="400">Unknown evidence cannot allow.</text>
    <text x="48" y="580" font-size="22" fill="#171716" font-weight="550">Within scope + valid allow decision → release. Otherwise → deny or human review.</text>
    <text x="48" y="617" font-size="19" fill="#706d67" font-weight="400">Configurable scope is shown. Protected defaults disable network exposure.</text>
  </g>
