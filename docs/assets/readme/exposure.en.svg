    <text x="48" y="57" font-size="17" fill="#f2381e" font-weight="700">02 / EXPOSURE POLICY</text>
    <text x="48" y="108" font-size="37" fill="#171716" font-weight="700">What is this credential allowed to reach?</text>
    <text x="48" y="148" font-size="23" fill="#706d67" font-weight="400">Humans configure five surfaces; fields inherit defaults or use their own rules.</text>
