  <title id="title">What is this credential allowed to reach?</title>
  <desc id="description">A human defines five credential exposure surfaces. The LLM compares the saved policy with runtime evidence and intended use. Plankton locally validates levels, destinations and uncertainty before automatic release.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="#706d67" />
    </marker>
  </defs>
