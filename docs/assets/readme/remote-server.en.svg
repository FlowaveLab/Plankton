<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="637" viewBox="0 0 1200 637" role="img" aria-labelledby="title description" xml:lang="en">
  <title id="title">Next: Plankton on a remote server.</title>
  <desc id="description">Planned remote architecture: agents on developer machines, SSH hosts and CI workers send authenticated requests to a Plankton server. Server policy and AI review can hand off to desktop human approval, with shared audit records. Not yet implemented.</desc>
