<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title description" xml:lang="en">
  <title id="title">Three routes. Human-defined boundaries.</title>
  <desc id="description">Three protected-credential approval modes. Manual review needs no model. Assisted mode uses LLM advice but the human decides. Automatic mode validates the LLM report locally and allows, denies, or escalates to a human.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="#706d67" />
    </marker>
  </defs>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="0" y="0" width="1200" height="660" fill="#f4f1ea" stroke="#f4f1ea" />
    <rect x="0" y="0" width="1200" height="6" fill="#f2381e" stroke="#f2381e" />
    <text x="48" y="57" font-size="17" fill="#f2381e" font-weight="700">01 / APPROVAL ROUTING</text>
    <text x="48" y="108" font-size="36" fill="#171716" font-weight="700">Three routes. Human-defined boundaries.</text>
    <text x="48" y="148" font-size="23" fill="#706d67" font-weight="400">Choose a mode for protected credentials in the desktop app.</text>
    <rect x="48" y="190" width="228" height="100" fill="#171716" stroke="#171716" />
    <svg width="21.0" height="21.0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" x="69.0" y="214.5" color="#fffefb">
      <path d="M2 21a8 8 0 0 1 13.292-6" />
      <circle cx="10" cy="8" r="5" />
      <path d="m16 19 2 2 4-4" />
    </svg>
    <text x="99.0" y="234" font-size="25" fill="#fffefb" font-weight="600">Human</text>
    <text x="69" y="267" font-size="16" fill="#b5b0a7" font-weight="400">No model required</text>
    <path d="M277 240 L319 240" stroke="#706d67" stroke-width="2" fill="none" marker-end="url(#arrow)" />
    <rect x="329" y="190" width="462" height="100" fill="#fffefb" stroke="#cfcac1" />
    <text x="350" y="234" font-size="24" fill="#171716" font-weight="600">Human inspects the evidence</text>
    <text x="350" y="267" font-size="18" fill="#706d67" font-weight="400">Call chain + request context</text>
    <path d="M793 240 L835 240" stroke="#706d67" stroke-width="2" fill="none" marker-end="url(#arrow)" />
    <rect x="845" y="190" width="307" height="100" fill="#fffefb" stroke="#cfcac1" />
    <svg width="18.48" height="18.48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" x="863.0" y="229.84" color="#f2381e">
      <path d="M20 6 9 17l-5-5" />
    </svg>
    <text x="890.48" y="247" font-size="22" fill="#f2381e" font-weight="600">Allow /  Deny</text>
    <rect x="48" y="318" width="228" height="100" fill="#171716" stroke="#171716" />
    <svg width="21.0" height="21.0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" x="69.0" y="342.5" color="#fffefb">
      <path d="M15 6a9 9 0 0 0-9 9V3" />
      <circle cx="18" cy="6" r="3" />
      <circle cx="6" cy="18" r="3" />
    </svg>
    <text x="99.0" y="362" font-size="25" fill="#fffefb" font-weight="600">Assisted</text>
    <text x="69" y="395" font-size="16" fill="#b5b0a7" font-weight="400">Human has the final say</text>
    <path d="M277 368 L319 368" stroke="#706d67" stroke-width="2" fill="none" marker-end="url(#arrow)" />
    <rect x="329" y="318" width="462" height="100" fill="#fffefb" stroke="#cfcac1" />
    <text x="350" y="362" font-size="24" fill="#171716" font-weight="600">LLM advice → Human decision</text>
    <text x="350" y="395" font-size="18" fill="#706d67" font-weight="400">Call chain + request context</text>
    <path d="M793 368 L835 368" stroke="#706d67" stroke-width="2" fill="none" marker-end="url(#arrow)" />
    <rect x="845" y="318" width="307" height="100" fill="#fffefb" stroke="#cfcac1" />
    <svg width="18.48" height="18.48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" x="863.0" y="357.84" color="#f2381e">
      <path d="M20 6 9 17l-5-5" />
    </svg>
    <text x="890.48" y="375" font-size="22" fill="#f2381e" font-weight="600">Allow /  Deny</text>
    <rect x="48" y="446" width="228" height="100" fill="#171716" stroke="#171716" />
    <svg width="21.0" height="21.0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" x="69.0" y="470.5" color="#fffefb">
      <path d="M12 8V4H8" />
      <rect width="16" height="12" x="4" y="8" rx="2" />
      <path d="M2 14h2" />
      <path d="M20 14h2" />
      <path d="M15 13v2" />
      <path d="M9 13v2" />
    </svg>
    <text x="99.0" y="490" font-size="25" fill="#fffefb" font-weight="600">Auto</text>
    <text x="69" y="523" font-size="16" fill="#b5b0a7" font-weight="400">Evidence + scope</text>
    <path d="M277 496 L319 496" stroke="#706d67" stroke-width="2" fill="none" marker-end="url(#arrow)" />
    <rect x="329" y="446" width="462" height="100" fill="#fffefb" stroke="#f2381e" />
    <text x="350" y="490" font-size="24" fill="#171716" font-weight="600">LLM report → Local validation</text>
    <text x="350" y="523" font-size="18" fill="#706d67" font-weight="400">Scope limits + destinations + uncertainty</text>
    <path d="M793 496 L835 496" stroke="#706d67" stroke-width="2" fill="none" marker-end="url(#arrow)" />
    <rect x="845" y="446" width="307" height="100" fill="#fffefb" stroke="#cfcac1" />
    <text x="863" y="503" font-size="22" fill="#f2381e" font-weight="600">Allow / Deny / Review</text>
    <text x="48" y="590" font-size="21" fill="#171716" font-weight="500">Escalate → wait for a human. Deny → no value released. Allow → resolve the value.</text>
    <text x="48" y="627" font-size="19" fill="#706d67" font-weight="400">Humans can decide any pending request; later model output cannot overwrite it.</text>
  </g>
</svg>
