<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="637" viewBox="0 0 1200 637" role="img" aria-labelledby="title description" xml:lang="zh-CN">
  <title id="title">下一步：让 Plankton 运行在远端 Server。</title>
  <desc id="description">规划中的远端架构：开发机、SSH 主机与 CI Worker 上的 Agent 向 Plankton Server 发送认证请求，服务端策略与 LLM 审查按需转交桌面人工审批，并记录审计。尚未实现。</desc>
