name: Build Release Artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-plankton-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive release version
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          workspace_version="$(perl -0ne 'print $1 if /\[workspace\.package\].*?^version = "([^"]+)"/ms' Cargo.toml)"
          if [ -z "$workspace_version" ]; then
            echo "workspace package version not found" >&2
            exit 1
          fi
          if [ "$version" != "$workspace_version" ]; then
            echo "tag version ${version} does not match workspace version ${workspace_version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build_cli:
    name: Build CLI ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: macos-14
            target: aarch64-apple-darwin

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2

      - name: Build plankton CLI
        run: cargo build --locked --release -p plankton --target ${{ matrix.target }}

      - name: Package CLI archive
        run: |
          bash scripts/package-cli-release.sh \
            "${{ needs.prepare.outputs.version }}" \
            "${{ matrix.target }}" \
            "target/${{ matrix.target }}/release/plankton" \
            dist

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: plankton-${{ matrix.target }}
          path: dist/*.tar.gz

  build_desktop:
    name: Build Desktop ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-14
            bundles: app
            artifact_name: plankton-desktop-macos
          - name: Windows x64
            runner: windows-2022
            bundles: nsis
            artifact_name: plankton-desktop-windows

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2

      - name: Install desktop dependencies
        run: npm --prefix apps/desktop ci

      - name: Build desktop bundle
        run: npm --prefix apps/desktop run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Build the bundled macOS CLI
        if: runner.os == 'macOS'
        run: cargo build --locked --release -p plankton

      - name: Package macOS desktop archive
        if: runner.os == 'macOS'
        run: |
          bash scripts/package-desktop-release.sh \
            "${{ needs.prepare.outputs.version }}" \
            "target/release/bundle/macos/Plankton.app" \
            dist

      - name: Package Windows desktop installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $installer = Get-ChildItem "target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Tauri did not produce an NSIS installer"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $installer.FullName "dist/plankton-v$env:VERSION-x86_64-pc-windows-msvc-setup.exe"

      - name: Upload desktop archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.zip
            dist/*.exe
