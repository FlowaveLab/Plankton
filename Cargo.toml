[workspace]
members = [
    "crates/plankton-protocol",
    "crates/plankton-core",
    "crates/plankton-store",
    "crates/plankton-client",
    "crates/plankton-daemon",
    "crates/plankton-cli",
    "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.2.1"
rust-version = "1.97"
license = "MIT"
homepage = "https://github.com/FlowaveLab/Plankton"
repository = "https://github.com/FlowaveLab/Plankton"

[workspace.dependencies]
agent-client-protocol = { version = "0.10.4", features = ["unstable_session_close", "unstable_session_usage", "unstable_session_model"] }
async-openai = { version = "0.34", default-features = false, features = ["rustls", "chat-completion"] }
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8.9"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
config = "0.14"
directories = "5.0"
dotenvy = "0.15"
minijinja = "2.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
llm-json-repair = "0.1"
serde_yaml_ng = "0.10"
semver = "1.0"
sha2 = "0.10"
strsim = "0.11"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "json", "migrate"] }
tauri = { version = "2.0", features = ["image-png", "tray-icon"] }
tauri-build = "2.0"
tauri-plugin-log = "2.0"
thiserror = "2.0"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "sync", "io-util", "process", "time", "net", "fs", "signal"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
toml = "0.8"
unicode-normalization = "0.1"
uuid = { version = "1.8", features = ["serde", "v4"] }
sysinfo = { version = "0.38.4", default-features = true }
libc = "0.2"
